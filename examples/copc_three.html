<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Potree + Three.js Fix</title>

    <!-- ✅ Load Potree Styles -->
    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
</head>

<body>

    <!-- ✅ Load Required Libraries -->
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/copc/index.js"></script>  
    <script src="../build/potree/potree.js"></script>

    <!-- ✅ Three.js + Potree Render Area -->
    <div class="container" style="position: absolute; width: 100%; height: 100%;">
        <div id="potree_render_area" style="position: absolute; width: 100%; height: 100%;"></div>
    </div>

    <script type="module">
        import * as THREE from "../libs/three.js/build/three.module.js";

        let renderer, potreeViewer, potreeScene, cube;

        function init() {
            console.log("✅ Initializing Scene...");

            // ✅ Create Potree Viewer
            potreeViewer = new Potree.Viewer(document.getElementById("potree_render_area"));
            potreeViewer.setEDLEnabled(true);
            potreeViewer.setFOV(60);
            potreeViewer.setPointBudget(5_000_000);

            // ✅ Use Potree's Scene (so cube and point cloud are in the same scene)
            potreeScene = new Potree.Scene();
            potreeViewer.setScene(potreeScene);

            // ✅ Use Potree's Renderer
            renderer = potreeViewer.renderer;
            renderer.setClearColor(0x000000, 0); // Transparent background
            renderer.autoClear = false; // Prevent automatic clearing

            // ✅ Get Potree's Camera (Use same camera for everything)
            let camera = potreeScene.getActiveCamera();
            potreeViewer.setControls(potreeViewer.orbitControls);

            // ✅ Add a Grid Helper (for debugging)
            const gridHelper = new THREE.GridHelper(200, 20, 0xffffff, 0x888888);
            potreeScene.scene.add(gridHelper); // ✅ Add to Potree Scene

            // ✅ Add a Three.js Cube for Testing
            const cubeGeometry = new THREE.BoxGeometry(1,1,1);
            const cubeMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(0, -2, 0);
            potreeScene.scene.add(cube); // ✅ Add cube to Potree Scene

            console.log("✅ Cube Added:", cube);

            // ✅ Load COPC Point Cloud into Potree
            const copcUrl = "../pointclouds/lion_takanawa.copc.laz"; // Update the correct path

            Potree.loadPointCloud(copcUrl, "lion", function(e) {
                if (!e || !e.pointcloud) {
                    console.error("❌ Point Cloud Failed to Load:", e);
                    return;
                }
                console.log("✅ Point Cloud Loaded:", e);
				// Align the point cloud with the grid helper: rotate 90 degrees around the x-axis
				e.pointcloud.rotation.x = Math.PI / 2;
				// Elevate the point cloud to be above the grid helper
				e.pointcloud.position.y = -2.5;

                potreeScene.addPointCloud(e.pointcloud);
                potreeViewer.fitToScreen();
            }, function(error) {
                console.error("❌ Error loading point cloud:", error);
            });

            // ✅ Start Render Loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // ✅ Rotate Cube to Ensure Visibility
            if (cube) {
                cube.rotation.y += 0.01;
            }

            // ✅ Potree Handles Rendering
            // potreeViewer.update();
        }

        // ✅ Handle Resizing
        window.addEventListener("resize", () => {
            potreeViewer.onWindowResize();
        });

        // ✅ Start Scene on Load
        window.onload = init;
    </script>
</body>
</html>
