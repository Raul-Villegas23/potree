<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Three.js Scene</title>

	<!-- ✅ Load Potree Styles -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
</head>

<body>

	<!-- ✅ Load Required Libraries -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/copc/index.js"></script>  <!-- Ensure this is before potree.js -->
	<script src="../build/potree/potree.js"></script>

	<!-- ✅ Three.js Render Area -->
	<div class="three_container" style="position: absolute; width: 100%; height: 100%;">
		<div id="three_render_area"></div>
	</div>

	<script type="module">
		import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.157/build/three.module.min.js";

		let scene, camera, renderer;

		function init() {
			console.log("Initializing Scene...");

			// ✅ Create Three.js Scene
			scene = new THREE.Scene();
			scene.background = new THREE.Color(0x202020);

			// ✅ Create a Single Camera for Three.js
			camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
			camera.position.set(0, 0, 100);

			// ✅ Create Three.js Renderer
			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.getElementById("three_render_area").appendChild(renderer.domElement);

			// ✅ Add a Three.js Cube for Testing
			const geometry = new THREE.BoxGeometry(10, 10, 10);
			const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
			const cube = new THREE.Mesh(geometry, material);
			cube.position.set(10, 10, 10);
			scene.add(cube);

			console.log("Cube Added:", cube);

			// ✅ Load Point Cloud
			Potree.loadPointCloud("../pointclouds/lion_takanawa.copc.laz", "lion", function(e) {
				console.log("Point Cloud Loaded:", e);
				scene.add(e.pointcloud);
			});

			// ✅ Start Render Loop
			animate();
		}

		function animate() {
			requestAnimationFrame(animate);

			// ✅ Rotate Cube (Ensures it's Visible)
			scene.traverse(object => {
				if (object instanceof THREE.Mesh) {
					object.rotation.y += 0.01;
				}
			});

			// ✅ Render Three.js Scene
			renderer.render(scene, camera);
		}

		// ✅ Handle Resizing
		window.addEventListener("resize", () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		// ✅ Start Scene on Load
		window.onload = init;
	</script>
</body>
</html>
